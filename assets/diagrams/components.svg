<svg width="100%" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three component types: fifteen skills carry the judgment and fire only when invoked; three agent types carry the reviewer, skeptic and mutation contracts so a dispatch prompt shrinks to scope; three warn-only hooks are run by the harness at the moments a skill is most often skipped - an edit adding a comment, a commit about to run, a branch landing on its target">
<rect x="1" y="1" width="898" height="468" rx="14" fill="#F7F6F3" stroke="#E2E0DB" stroke-width="1"/>
<text x="26" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B877F" letter-spacing="1.2">SKILLS &#183; THE JUDGMENT</text>
<rect x="26" y="56" width="848" height="58" rx="8" fill="#E2F0ED" stroke="#2F7A6F" stroke-width="0.6"/>
<text x="450" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">fifteen SKILL.md instruction packages</text>
<text x="450" y="97" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3A7A70" text-anchor="middle" dominant-baseline="central">loaded when the task matches - a skill only changes the run if it is invoked</text>
<text x="26" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B877F" letter-spacing="1.2">AGENTS &#183; THE CONTRACT A DISPATCH NO LONGER RESTATES</text>
<rect x="26" y="168" width="272" height="74" rx="8" fill="#FBEFDC" stroke="#B47B2B" stroke-width="0.6"/>
<text x="162" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8A5A1D" text-anchor="middle" dominant-baseline="central">axis-reviewer</text>
<text x="162" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">one review axis,</text>
<text x="162" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">the finding format</text>
<rect x="314" y="168" width="272" height="74" rx="8" fill="#FBEFDC" stroke="#B47B2B" stroke-width="0.6"/>
<text x="450" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8A5A1D" text-anchor="middle" dominant-baseline="central">refute-verifier</text>
<text x="450" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">tries to break</text>
<text x="450" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">each claim</text>
<rect x="602" y="168" width="272" height="74" rx="8" fill="#FBEFDC" stroke="#B47B2B" stroke-width="0.6"/>
<text x="738" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8A5A1D" text-anchor="middle" dominant-baseline="central">mutation-tester</text>
<text x="738" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">measures instead</text>
<text x="738" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">of reading</text>
<text x="26" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74">review-pr, implementation-gates and verifying-before-sending dispatch into these - the prompt carries only axis, worktree, SHA and scope.</text>
<text x="26" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B877F" letter-spacing="1.2">HOOKS &#183; RUN BY THE HARNESS, INVOKED BY NOBODY</text>
<rect x="26" y="324" width="272" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="162" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">an edit adds a comment</text>
<text x="162" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">comment-discipline</text>
<text x="162" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">backs writing-code-comments</text>
<rect x="314" y="324" width="272" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="450" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">a commit is about to run</text>
<text x="450" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">comment-discipline-commit</text>
<text x="450" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">the same tells, however authored</text>
<rect x="602" y="324" width="272" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="738" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">a branch lands on its target</text>
<text x="738" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">landed-branch</text>
<text x="738" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">backs landing-merged-work</text>
<text x="26" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74">All three warn and none block: a hook cannot judge whether a comment earns its place, only that the skill that owns the judgment was not consulted.</text>
</svg>
