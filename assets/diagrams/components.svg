<svg width="100%" viewBox="0 0 900 758" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three component types: eighteen skills carry the judgment and fire only when invoked; three agent types carry the reviewer, skeptic and mutation contracts so a dispatch prompt shrinks to scope; eight hooks are run by the harness - four warn at the moments a skill is most often skipped (an edit adding a comment, a commit about to run, a branch landing on its target, a turn leaving tracked changes uncommitted), one stops a commit, a pull request, a memory write or a subagent dispatch once until the skill that owns it is loaded, and three inject what a session cannot see for itself (the standing rules at session start, how far into its context window it has run, and the lines a turn's change to a rule file left stale elsewhere)">
<rect x="1" y="1" width="898" height="756" rx="14" fill="#F7F6F3" stroke="#E2E0DB" stroke-width="1"/>
<text x="26" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B877F" letter-spacing="1.2">SKILLS &#183; THE JUDGMENT</text>
<rect x="26" y="56" width="848" height="58" rx="8" fill="#E2F0ED" stroke="#2F7A6F" stroke-width="0.6"/>
<text x="450" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">eighteen SKILL.md instruction packages</text>
<text x="450" y="97" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#3A7A70" text-anchor="middle" dominant-baseline="central">loaded when the task matches - a skill only changes the run if it is invoked</text>
<text x="26" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B877F" letter-spacing="1.2">AGENTS &#183; THE CONTRACT A DISPATCH NO LONGER RESTATES</text>
<rect x="26" y="168" width="272" height="74" rx="8" fill="#FBEFDC" stroke="#B47B2B" stroke-width="0.6"/>
<text x="162" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8A5A1D" text-anchor="middle" dominant-baseline="central">axis-reviewer</text>
<text x="162" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">one review axis,</text>
<text x="162" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">the finding format</text>
<rect x="314" y="168" width="272" height="74" rx="8" fill="#FBEFDC" stroke="#B47B2B" stroke-width="0.6"/>
<text x="450" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8A5A1D" text-anchor="middle" dominant-baseline="central">refute-verifier</text>
<text x="450" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">tries to break</text>
<text x="450" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">each claim</text>
<rect x="602" y="168" width="272" height="74" rx="8" fill="#FBEFDC" stroke="#B47B2B" stroke-width="0.6"/>
<text x="738" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8A5A1D" text-anchor="middle" dominant-baseline="central">mutation-tester</text>
<text x="738" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">measures instead</text>
<text x="738" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">of reading</text>
<text x="26" y="262" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74">review-pr, implementation-gates and verifying-before-sending dispatch into these - the prompt carries only axis, worktree, SHA and scope.</text>
<text x="26" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B877F" letter-spacing="1.2">HOOKS &#183; RUN BY THE HARNESS, INVOKED BY NOBODY</text>
<rect x="26" y="324" width="274" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="163" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">an edit adds a comment</text>
<text x="163" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">comment-discipline</text>
<text x="163" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">backs writing-code-comments</text>
<rect x="313" y="324" width="274" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="450" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">a commit is about to run</text>
<text x="450" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">comment-discipline-commit</text>
<text x="450" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">the same tells, however authored</text>
<rect x="600" y="324" width="274" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="737" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">a branch lands on its target</text>
<text x="737" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">landed-branch</text>
<text x="737" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">backs landing-merged-work</text>
<rect x="26" y="422" width="274" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="163" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">a turn leaves changes behind</text>
<text x="163" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">uncommitted-changes</text>
<text x="163" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">the tracked files still to commit</text>
<rect x="313" y="422" width="274" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="450" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">a session starts</text>
<text x="450" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">session-brief</text>
<text x="450" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">the standing rules, as pointers</text>
<rect x="600" y="422" width="274" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="737" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">a prompt is submitted</text>
<text x="737" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">context-meter</text>
<text x="737" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">how far into the window it has run</text>
<rect x="26" y="520" width="848" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="450" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">the session reaches a commit, a pull request, a memory write or a subagent dispatch</text>
<text x="450" y="566" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">skill-gate</text>
<text x="450" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">stops the act once, until the skill that owns it is loaded</text>
<rect x="26" y="618" width="848" height="86" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="450" y="638" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">a turn that changed a rule file ends</text>
<text x="450" y="664" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">landing-sweep</text>
<text x="450" y="686" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#807C74" text-anchor="middle" dominant-baseline="central">the lines elsewhere that still say what the change replaced</text>
<text x="26" y="732" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74">Four warn, three inject, one stops once: none can judge whether a comment earns its place or a session should stop, only that the moment arrived.</text>
</svg>
