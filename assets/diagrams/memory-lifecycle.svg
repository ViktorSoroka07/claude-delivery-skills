<svg width="100%" viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Memory lifecycle: a correction in chat lands in memory as a capture buffer; once confirmed in practice it graduates into a skill, the durable home; the memory condenses to a pointer plus residue plus capture buffer, where new corrections land again">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9AA0A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="1" y="1" width="758" height="288" rx="14" fill="#F7F6F3" stroke="#E2E0DB" stroke-width="1"/>

<rect x="28" y="70" width="160" height="48" rx="24" fill="#ECEEF2" stroke="#6B7280" stroke-width="0.6"/>
<text x="108" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#3A414D" text-anchor="middle" dominant-baseline="central">correction in chat</text>

<line x1="192" y1="94" x2="244" y2="94" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="252" y="64" width="180" height="60" rx="8" fill="#FBEFDC" stroke="#B47B2B" stroke-width="0.6"/>
<text x="342" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#8A5A1D" text-anchor="middle" dominant-baseline="central">memory</text>
<text x="342" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#A2743A" text-anchor="middle" dominant-baseline="central">the capture buffer</text>

<text x="494" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">confirmed in practice</text>
<line x1="436" y1="94" x2="548" y2="94" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="556" y="64" width="176" height="60" rx="8" fill="#E2F0ED" stroke="#2F7A6F" stroke-width="0.6"/>
<text x="644" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">skill</text>
<text x="644" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#2F7A6F" text-anchor="middle" dominant-baseline="central">the durable home</text>

<text x="668" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74" text-anchor="start" dominant-baseline="central">condenses to</text>
<line x1="644" y1="128" x2="600" y2="198" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="420" y="204" width="280" height="52" rx="8" fill="#FBEFDC" stroke="#B47B2B" stroke-width="0.6"/>
<text x="560" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#8A5A1D" text-anchor="middle" dominant-baseline="central">pointer + residue + capture buffer</text>

<text x="352" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74" text-anchor="end" dominant-baseline="central">new corrections</text>
<text x="352" y="219" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74" text-anchor="end" dominant-baseline="central">land here</text>
<line x1="416" y1="230" x2="342" y2="132" stroke="#9AA0A8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</svg>
