<svg width="100%" viewBox="0 0 960 478" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The send moment as two axes: verifying-before-sending owns whether the claims are true, writing-for-audiences owns whether the prose fits the reader; only text in the corner that is both true and fits leaves the workspace, and the other three corners name the failure each skill catches">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9AA0A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="1" y="1" width="958" height="476" rx="14" fill="#F7F6F3" stroke="#E2E0DB" stroke-width="1"/>

<text x="26" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B877F" letter-spacing="1.2">THE SEND MOMENT &#183; TWO SKILLS FIRE TOGETHER, ONE AXIS EACH</text>

<rect x="26" y="218" width="168" height="60" rx="30" fill="#ECEEF2" stroke="#6B7280" stroke-width="0.6"/>
<text x="110" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#3A414D" text-anchor="middle" dominant-baseline="central">factual text about to</text>
<text x="110" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#3A414D" text-anchor="middle" dominant-baseline="central">leave the workspace</text>

<line x1="198" y1="248" x2="236" y2="248" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="244" y="64" width="48" height="304" rx="8" fill="#E2F0ED" stroke="#2F7A6F" stroke-width="0.6"/>
<text transform="rotate(-90 259 216)" x="259" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">writing-for-audiences</text>
<text transform="rotate(-90 279 216)" x="279" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#2F7A6F" text-anchor="middle" dominant-baseline="central">does the prose fit the reader?</text>
<text transform="rotate(-90 268 356)" x="268" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#2F7A6F" text-anchor="start" dominant-baseline="central">does not fit</text>
<text transform="rotate(-90 268 76)" x="268" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#2F7A6F" text-anchor="end" dominant-baseline="central">fits</text>

<rect x="300" y="64" width="309" height="144" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="454.5" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">fits the reader &#183; claims wrong</text>
<text x="454.5" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#3A414D" text-anchor="middle" dominant-baseline="central">reads fine and is wrong</text>
<text x="454.5" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5B6472" text-anchor="middle" dominant-baseline="central">a blind pass once corrected four claims in a</text>
<text x="454.5" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5B6472" text-anchor="middle" dominant-baseline="central">document that had already passed self-review</text>

<rect x="625" y="64" width="309" height="144" rx="8" fill="#E2F0ED" stroke="#2F7A6F" stroke-width="0.6"/>
<text x="779.5" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#2F7A6F" text-anchor="middle" dominant-baseline="central">fits the reader &#183; claims true</text>
<text x="779.5" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">leaves the workspace</text>
<text x="779.5" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2F7A6F" text-anchor="middle" dominant-baseline="central">the warrant stated, never the feeling;</text>
<text x="779.5" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2F7A6F" text-anchor="middle" dominant-baseline="central">every number carrying its base</text>

<rect x="300" y="224" width="309" height="144" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="454.5" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">does not fit &#183; claims wrong</text>
<text x="454.5" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#3A414D" text-anchor="middle" dominant-baseline="central">wrong and unusable</text>
<text x="454.5" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5B6472" text-anchor="middle" dominant-baseline="central">both skills have work to do</text>
<text x="454.5" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5B6472" text-anchor="middle" dominant-baseline="central">before any of it is sent</text>

<rect x="625" y="224" width="309" height="144" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="779.5" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#807C74" text-anchor="middle" dominant-baseline="central">does not fit &#183; claims true</text>
<text x="779.5" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#3A414D" text-anchor="middle" dominant-baseline="central">true, and the reader cannot use it</text>
<text x="779.5" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5B6472" text-anchor="middle" dominant-baseline="central">"40%" invites "of what?"; a base dropped,</text>
<text x="779.5" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5B6472" text-anchor="middle" dominant-baseline="central">a register the reader was not written for</text>

<rect x="300" y="392" width="634" height="48" rx="8" fill="#E2F0ED" stroke="#2F7A6F" stroke-width="0.6"/>
<text x="617" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1C5A51" text-anchor="middle" dominant-baseline="central">verifying-before-sending</text>
<text x="617" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#2F7A6F" text-anchor="middle" dominant-baseline="central">are the claims true?</text>
<text x="314" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#2F7A6F" text-anchor="start" dominant-baseline="central">wrong</text>
<text x="920" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#2F7A6F" text-anchor="end" dominant-baseline="central">true</text>
</svg>
