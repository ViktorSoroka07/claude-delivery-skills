<svg width="100%" viewBox="0 0 1100 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What the merge leaves behind and the check that closes each: a branch ancestry commands call unmerged, closed by testing containment against the request's recorded head; an unclaimed worktree, removed with the restore SHA printed; memory entries describing finished work, pruned in the same pass; a tracker item open on the board, closed on figures asked for. Footer: no empty result is trusted from a command whose exit status went unchecked">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9AA0A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="1" y="1" width="1098" height="390" rx="14" fill="#F7F6F3" stroke="#E2E0DB" stroke-width="1"/>

<text x="26" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B877F" letter-spacing="1.2">WHAT THE MERGE LEAVES BEHIND &#183; AND THE CHECK THAT CLOSES EACH</text>

<rect x="26" y="169" width="220" height="60" rx="30" fill="#ECEEF2" stroke="#6B7280" stroke-width="0.6"/>
<text x="136" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#3A414D" text-anchor="middle" dominant-baseline="central">a branch lands on its target</text>
<text x="136" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#5B6472" text-anchor="middle" dominant-baseline="central">in a session not planning for it</text>

<path d="M250 199 H270" fill="none" stroke="#9AA0A8" stroke-width="1.5"/>
<line x1="270" y1="94" x2="270" y2="304" stroke="#9AA0A8" stroke-width="1.5"/>
<line x1="270" y1="94" x2="286" y2="94" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="164" x2="286" y2="164" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="234" x2="286" y2="234" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="304" x2="286" y2="304" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="292" y="64" width="782" height="60" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="310" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#3A414D" dominant-baseline="central">a branch every ancestry command calls unmerged</text>
<text x="310" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#807C74" dominant-baseline="central">the squash commit carries no link back to it</text>
<line x1="640" y1="94" x2="668" y2="94" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="684" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" dominant-baseline="central">containment tested against the request's recorded head</text>
<text x="684" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#807C74" dominant-baseline="central">the forge says which head it merged; reachability cannot</text>

<rect x="292" y="134" width="782" height="60" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="310" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#3A414D" dominant-baseline="central">a worktree nobody claims</text>
<text x="310" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#807C74" dominant-baseline="central">parked at &#8220;PR open&#8221; by the finishing skill</text>
<line x1="640" y1="164" x2="668" y2="164" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="684" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" dominant-baseline="central">removed, the restore SHA printed with every deletion</text>
<text x="684" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#807C74" dominant-baseline="central">deletion drops the reflog; the scrollback is not a safety net</text>

<rect x="292" y="204" width="782" height="60" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="310" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#3A414D" dominant-baseline="central">memory entries describing finished work</text>
<text x="310" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#807C74" dominant-baseline="central">a later session reads them with full authority</text>
<line x1="640" y1="234" x2="668" y2="234" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="684" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" dominant-baseline="central">pruned in the same pass, never deferred</text>
<text x="684" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#807C74" dominant-baseline="central">the stale pointer is authoritative the moment the branch is gone</text>

<rect x="292" y="274" width="782" height="60" rx="8" fill="#FFFFFF" stroke="#E2E0DB" stroke-width="1"/>
<text x="310" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-style="italic" fill="#3A414D" dominant-baseline="central">a tracker item closed in fact, open on the board</text>
<text x="310" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-style="italic" fill="#807C74" dominant-baseline="central">the board is what gets re-asked</text>
<line x1="640" y1="304" x2="668" y2="304" stroke="#9AA0A8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="684" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#1C5A51" dominant-baseline="central">closed on figures asked for, never inferred</text>
<text x="684" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#807C74" dominant-baseline="central">a parent closes when every child is closed there, not here</text>

<text x="26" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#807C74">No empty result is trusted from a command whose exit status went unchecked: a failed check prints the same nothing as a clean one, and issues confident false clearance.</text>
</svg>
