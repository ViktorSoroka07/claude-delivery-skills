schema_version: "1.1"
name: maintaining-project-memory-prunes-the-store
context:
  # The scaffold's working directory is not documented for this early-access
  # command. This assumes it is the plugin root and the run workspace is a
  # separate empty directory named by $PWD at agent time; if the command
  # reports the fixture script as missing, fix the path here once and note
  # the answer in CONTRIBUTING's "Testing a wording change".
  scaffold_script: |
    f=evals/fixtures/memory-store.sh
    [ -f "$f" ] || { echo "scaffold: $f not found from $(pwd); see CONTRIBUTING" >&2; exit 1; }
    sh "$f" . >/dev/null
