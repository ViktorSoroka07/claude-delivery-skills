name: guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    strategy:
      fail-fast: false
      matrix:
        # Three OSes, three greps: GNU (ubuntu), BSD (macos), and Git for
        # Windows' MSYS2 environment - each has already caught a bug the
        # others let through.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history scan needs every commit, not a shallow tip

      - name: Guard self-tests
        run: sh scripts/test-guard.sh

      # Both comment-discipline hooks fail open by design, so a syntax error
      # or broken import turns them silently inert in every session - these
      # tests are the only place such a break is visible.
      - name: Comment-hook self-tests
        run: sh scripts/test-hooks.sh

      # .leakwords.local never leaves the author's machine, so CI can check
      # only the committed shape patterns. The local pre-push scan, with the
      # full wordlist, remains the real gate.
      - name: History scan (structural patterns only)
        run: sh scripts/scan-history.sh

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Three real shell bugs shipped in these scripts before shellcheck
      # was pointed at them; it stays pointed at them.
      - name: ShellCheck the guard scripts
        run: shellcheck .githooks/pre-commit scripts/*.sh evals/fixtures/*.sh skills/*/*.sh

      # The consistency gates: self-test the checkers, verify every internal
      # reference resolves, and prove the canonical inventory statements match
      # the tree (regenerate + diff; a failure's fix is running the generator).
      - name: Consistency-gate self-tests
        run: sh scripts/test-repo-checks.sh

      - name: Reference integrity
        run: sh scripts/check-refs.sh

      - name: Inventory statements current
        run: |
          sh scripts/generate-inventory.sh
          git diff --exit-code || { echo "Stale inventory statements - run: sh scripts/generate-inventory.sh"; exit 1; }

      # The Agent Skills reference validator (PyPI: skills-ref; the installed
      # command is `agentskills`) - frontmatter validity, name/directory
      # agreement, and the spec's length limits, for every skill.
      # pipx rather than pip: newer runner images mark the system python
      # externally managed, and a PEP 668 refusal would fail the job.
      - name: Validate every skill against the Agent Skills spec
        run: |
          pipx install skills-ref
          for d in skills/*/SKILL.md; do
            agentskills validate "$(dirname "$d")"
          done

  release:
    # A release is a version bump. When a push to main carries a manifest
    # version that has no release yet, the guarded run creates the tag and
    # the release, with notes generated from the commit messages since the
    # previous tag. A push that leaves the version alone releases nothing.
    needs: [guard, conformance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release the manifest version if it has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released"
            exit 0
          fi
          gh release create "v$v" --target "$GITHUB_SHA" --generate-notes
