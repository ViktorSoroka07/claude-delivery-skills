name: guard

on:
  push:
  pull_request:

jobs:
  guard:
    strategy:
      fail-fast: false
      matrix:
        # Three OSes, three greps: GNU (ubuntu), BSD (macos), and Git for
        # Windows' MSYS2 environment - each has already caught a bug the
        # others let through.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history scan needs every commit, not a shallow tip

      - name: Guard self-tests
        run: sh scripts/test-guard.sh

      # .leakwords.local never leaves the author's machine, so CI can check
      # only the committed shape patterns. The local pre-push scan, with the
      # full wordlist, remains the real gate.
      - name: History scan (structural patterns only)
        run: sh scripts/scan-history.sh

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Three real shell bugs shipped in these scripts before shellcheck
      # was pointed at them; it stays pointed at them.
      - name: ShellCheck the guard scripts
        run: shellcheck .githooks/pre-commit scripts/*.sh

      # The Agent Skills reference validator (PyPI: skills-ref; the installed
      # command is `agentskills`) - frontmatter validity, name/directory
      # agreement, and the spec's length limits, for every skill.
      - name: Validate every skill against the Agent Skills spec
        run: |
          python3 -m pip install --quiet skills-ref
          for d in */SKILL.md; do
            agentskills validate "$(dirname "$d")"
          done
