name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # creating the release requires it; nothing else granted

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release notes are generated from the commit history since the previous
      # tag - the commit messages carry the mechanisms, so the notes do too.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
